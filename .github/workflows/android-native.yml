name: Android native verification

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "app.json"
      - "app/**"
      - "src/components/NotificationSetupCard.tsx"
      - "package.json"
      - "eas.json"
      - "assets/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Verify release does not shrink native modules
        run: |
          grep -q 'android.enableMinifyInReleaseBuilds=false' android/gradle.properties
          grep -q 'android.enableShrinkResourcesInReleaseBuilds=false' android/gradle.properties
      - name: Verify explicit React Native fallback registration
        run: |
          grep -Rn 'add(expo.modules.buscadornotifications.BuscadorLegacyPackage())' android/app/src/main/java
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon :expo:compileDebugKotlin :buscador-notifications:compileDebugKotlin
          echo "Expo package provider references (informational):"
          find . -type f \( -name '*PackageList.kt' -o -name '*PackageList.java' \) -exec grep -n 'BuscadorNotificationsModule' {} + || true
      - name: Build actual release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify notification service and native class inside release APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo 'No APK found'; exit 1; fi
          echo "Release APK: $APK"
          ls -lh "$APK"
          AAPT=$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo "ERROR: Android SDK aapt not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -A 6 -B 3 'BuscadorNotificationListener' 
          unzip -p "$APK" 'classes*.dex' | strings | grep -Fq 'BuscadorNotificationsLegacy'
          echo 'PASS: explicitly registered React Native native module present in release dex'
          echo 'PASS: notification listener present in release manifest'
