name: Kotlin Android APK
on:
  push:
    branches: [main, feat/kotlin-native-migration, feat/six-screen-auth-redesign]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Android SDK in GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android APK (Kotlin only)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android notification listener
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -A 6 'BuscadorNotificationListener'
          unzip -p "$APK" 'classes*.dex' | strings | grep -Fq 'BuscadorNotificationListener'
          echo "Kotlin NotificationListenerService packaged in APK"
      - name: Name installable package Buscador.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Buscador.apk
      - name: Upload native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Buscador
          path: dist/Buscador.apk
          if-no-files-found: error
          retention-days: 14
