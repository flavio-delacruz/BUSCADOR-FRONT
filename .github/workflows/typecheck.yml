name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Android local module autolinking
        run: |
          npx expo-modules-autolinking resolve --platform android > /tmp/buscador-android-modules.json
          node -e "const j=require('/tmp/buscador-android-modules.json'); const s=JSON.stringify(j); if(!s.includes('BuscadorNotificationsModule')){console.error('ERROR: BuscadorNotificationsModule was not autolinked'); process.exit(1)} console.log('Android notification module detected by Expo Autolinking')"
      - name: Check types
        run: npm run typecheck
