name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Android local module autolinking
        run: |
          npx expo-modules-autolinking resolve --platform android > /tmp/buscador-android-modules.json
          if grep -q 'BuscadorNotificationsModule' /tmp/buscador-android-modules.json; then
            echo "Android notification module detected by Expo Autolinking"
          else
            echo "ERROR: BuscadorNotificationsModule was not autolinked"
            head -c 3000 /tmp/buscador-android-modules.json
            exit 1
          fi
      - name: Check types
        run: npm run typecheck
